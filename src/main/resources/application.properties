spring.application.name=campus-crate-backend
# Spring Boot does not load .env files by default. Treat this project-local file as properties for local development.
spring.config.import=optional:file:.env[.properties]

# Required database configuration. Example: jdbc:mysql://localhost:3306/campus_crate?useSSL=false&serverTimezone=UTC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

server.port=${SERVER_PORT:8089}
server.forward-headers-strategy=framework
server.error.include-message=never

# A 32-byte-or-longer secret is required for JWT signing.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Resend email verification. RESEND_FROM_EMAIL must use a Resend-verified domain.
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

# Cloudinary image uploads.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:campus-crate/items}

# Comma-separated browser origins, for example http://localhost:5173,https://app.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://dbms-frontend-xu29.onrender.com}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:10MB}
